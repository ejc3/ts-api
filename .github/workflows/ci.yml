name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Protobuf codegen is up to date
        # git add -N stages untracked files as empty so a newly generated file
        # surfaces in the diff instead of slipping past --exit-code.
        run: |
          pnpm exec buf generate
          git add -N src/grpc/gen
          git diff --exit-code src/grpc/gen
      - name: Format + lint (biome)
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Test
        run: pnpm exec vitest run
      - name: Cloudflare build smoke (dry run)
        run: pnpm exec wrangler deploy --dry-run --outdir dist/worker
