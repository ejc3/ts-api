name: Deploy (Cloudflare)

# Deploy the Worker only after CI passes on main. workflow_run fires when the CI
# workflow completes; the job guard requires a green conclusion, so a red gate
# never ships. workflow_dispatch allows an on-demand deploy from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    # Only a green CI run of a PUSH to this repository's own main, or a manual dispatch on main. The
    # `branches: [main]` filter above matches the triggering run's head BRANCH NAME, which a fork pull
    # request names itself: a fork PR from a branch called main runs CI, and its green run would check
    # out and deploy the fork's commit with CLOUDFLARE_API_TOKEN. The event, head repository and branch
    # checks below rule that out.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      # Deploy the exact commit CI validated, not the moving tip of main — otherwise a
      # newer, untested commit could ship on an older commit's green run. Falls back to
      # the ref for a manual workflow_dispatch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Worker
        # account_id and the D1 binding come from wrangler.jsonc; only the API
        # token is a secret. JWT_SECRET is a Worker secret set out of band.
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke the live Worker
        # The Worker serves the three Fetch styles; gRPC and Express are Vercel-only.
        run: node scripts/smoke.mjs --url https://ts-api.ejc3-ts.workers.dev --styles rest,trpc,graphql
